# 类型检查配置（scripts/run_checks.py typecheck 使用）。
# 采用「先覆盖基础设施层、再逐步扩到算法层」的渐进策略：算法层张量运算多，
# 一次性拉满会产生数百条与正确性无关的报错，反而掩盖真问题。
[mypy]
python_version = 3.11
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
check_untyped_defs = False
files = rl_server/core, rl_server/utils, rl_server/transport, rl_server/config, scripts
