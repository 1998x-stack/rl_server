name: python-regression

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q rl_server tests
      - name: Unit, smoke and integration tests
        run: python -m pytest tests -q --disable-warnings --maxfail=1
