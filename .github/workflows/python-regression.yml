name: python-regression

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q rl_server tests
      - name: Unit, smoke and integration tests
        run: python -m pytest tests -q --disable-warnings --maxfail=1

      # --- 隔离检查管线：unit(+DQN e2e) / lint / typecheck，再由独立评测器复核 ---
      - name: Install check tooling
        run: python -m pip install ruff mypy
      - name: Isolated checks (unit, lint, typecheck, DQN e2e)
        run: |
          python scripts/run_checks.py unit lint typecheck e2e \
            --envs DQNGymClassic --seconds 10 | tee checks.json
          echo "RUN_DIR=$(python -c "import json;print(json.load(open('checks.json'))['run_dir'])")" >> "$GITHUB_ENV"
      - name: Independent evaluation
        run: python scripts/evaluate.py --run-dir "$RUN_DIR"
      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.run_id }}
          path: |
            ${{ env.RUN_DIR }}
